services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-acadelytics}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - acadelytics-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      HOST: "${BACKEND_HOST:-0.0.0.0}"
      PORT: "${BACKEND_PORT:-5000}"
      DB_USERNAME: "${DB_USER:-postgres}"
      PASSWORD: "${DB_PASSWORD:-postgres}"
      DATABASE: "${DB_NAME:-acadelytics}"
      DB_HOST: "${DB_HOST:-db}"
      ACCESS_TOKEN_SECRET: "${ACCESS_TOKEN_SECRET:-supersecret}"
      cookieKey: "${COOKIE_KEY:-supersecret_cookie}"
    networks:
      - acadelytics-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    networks:
      - acadelytics-network

volumes:
  pgdata:

networks:
  acadelytics-network:
    driver: bridge
