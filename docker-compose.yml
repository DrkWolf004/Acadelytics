services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_NAME:-acadelytics}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-acadelytics}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - acadelytics-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_NAME: "${DB_NAME:-acadelytics}"
      DB_HOST: "db"
      DB_USERNAME: "${DB_USER:-postgres}"
      PASSWORD: "${DB_PASSWORD:-postgres}"
      DATABASE: "${DB_NAME:-acadelytics}"
      ACCESS_TOKEN_SECRET: "${ACCESS_TOKEN_SECRET:-supersecret_jwt_key}"
      COOKIE_KEY: "${COOKIE_KEY:-supersecret_cookie_key}"
      PYTHONUNBUFFERED: "1"
    networks:
      - acadelytics-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4173}:4173"
    networks:
      - acadelytics-network

volumes:
  pgdata:

networks:
  acadelytics-network:
    driver: bridge
